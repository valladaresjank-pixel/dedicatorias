<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, mi amor 💌</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 20% 10%,#ff9a9e 0%,#fecfef 45%,#fbc2eb 100%);
    background-attachment:fixed;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    display:flex;justify-content:center;align-items:flex-start;
    padding:20px;overflow-x:hidden;position:relative;
  }
  .floaty{position:fixed;top:-8%;animation:fall linear infinite;opacity:.75;z-index:0;pointer-events:none}
  @keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(112vh) rotate(360deg);opacity:0}}

  .container{width:100%;max-width:560px;z-index:10;position:relative;margin:auto}
  .stage{display:none;text-align:center}
  .stage.active{display:block;animation:popUp .8s ease-out both}
  @keyframes popUp{0%{opacity:0;transform:scale(.85) translateY(30px)}100%{opacity:1;transform:none}}

  /* ---------- ETAPA 1: SOBRE ---------- */
  #stage1{padding-top:6vh}
  .title-hint{color:#fff;font-size:1.25rem;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.25);margin-bottom:6px}
  .sub-hint{color:#fff;opacity:.95;margin-bottom:28px;font-size:.95rem;text-shadow:0 1px 5px rgba(0,0,0,.2)}

  .envelope{
    position:relative;width:100%;max-width:380px;height:250px;margin:0 auto;
    background:linear-gradient(160deg,#ff6b81,#e84163);
    border-radius:12px;box-shadow:0 20px 45px rgba(214,48,49,.45);
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{50%{transform:translateY(-8px)}}
  .envelope::before{ /* solapas laterales e inferior */
    content:"";position:absolute;inset:0;border-radius:12px;
    background:
      linear-gradient(to top right,transparent 49.5%,rgba(0,0,0,.12) 50%) left bottom/50% 100% no-repeat,
      linear-gradient(to top left,transparent 49.5%,rgba(0,0,0,.12) 50%) right bottom/50% 100% no-repeat;
  }
  .flap{
    position:absolute;top:0;left:0;width:100%;height:55%;
    background:linear-gradient(180deg,#ff8fa3,#f0506e);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top;transition:transform .9s ease;z-index:3;
    border-radius:12px 12px 0 0;
  }
  .envelope.open .flap{transform:rotateX(180deg);z-index:0}
  .seal{
    position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#ffd86b,#e8a317);
    border:3px solid #fff;display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;z-index:4;box-shadow:0 4px 12px rgba(0,0,0,.3);
    transition:opacity .5s,transform .5s;
  }
  .envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  .to{position:absolute;bottom:22px;width:100%;text-align:center;color:#fff;font-weight:700;letter-spacing:1px;z-index:2;font-size:1.1rem}

  /* clips */
  .clip{
    position:absolute;z-index:6;font-size:2.6rem;cursor:pointer;user-select:none;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));
    transition:transform .5s ease,opacity .5s ease;animation:wiggle 1.6s ease-in-out infinite;
  }
  .envelope.tap{animation:tapShake .45s ease}
  @keyframes tapShake{0%{transform:scale(1)}30%{transform:scale(.93) rotate(-3deg)}60%{transform:scale(1.06) rotate(3deg)}100%{transform:scale(1)}}
  .clip:hover{transform:scale(1.25) rotate(-10deg)}
  .clip.gone{transform:translate(var(--dx),-180px) rotate(540deg) scale(.2);opacity:0;pointer-events:none}
  @keyframes wiggle{0%,100%{rotate:-6deg}50%{rotate:8deg}}

  /* barra de progreso */
  .progress-wrap{width:100%;max-width:380px;margin:34px auto 0}
  .progress-label{color:#fff;font-weight:700;margin-bottom:8px;text-shadow:0 1px 5px rgba(0,0,0,.25)}
  .bar{height:22px;background:rgba(255,255,255,.55);border-radius:20px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.15)}
  .bar-fill{
    height:100%;width:0;border-radius:20px;
    background:linear-gradient(90deg,#ff4757,#ff9ff3,#feca57);
    transition:width .8s cubic-bezier(.4,1.3,.5,1);
    background-size:200% 100%;animation:shine 2s linear infinite;
  }
  @keyframes shine{to{background-position:-200% 0}}
  .pct{font-size:1.5rem;font-weight:800;color:#fff;margin-top:8px;text-shadow:0 2px 6px rgba(0,0,0,.25)}

  /* ---------- ETAPA 2: FOTOS ---------- */
  #stage2 h2{color:#fff;font-size:1.7rem;text-shadow:0 2px 8px rgba(0,0,0,.3);margin:10px 0 4px}
  #stage2 p.sub{color:#fff;margin-bottom:22px;text-shadow:0 1px 5px rgba(0,0,0,.25)}
  .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px;padding:6px}
  .polaroid{
    background:#fff;padding:9px 9px 46px;border-radius:6px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);position:relative;
    opacity:0;transform:translateY(60px) rotate(0) scale(.7);
    transition:transform .8s cubic-bezier(.3,1.4,.5,1),opacity .8s;
  }
  .polaroid.show{opacity:1;transform:translateY(0) rotate(var(--r)) scale(1)}
  .polaroid:hover{transform:rotate(0) scale(1.06);z-index:5}
  .polaroid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;display:block;background:#ffe3ea}
  .polaroid span{position:absolute;bottom:7px;left:0;width:100%;padding:0 6px;text-align:center;font-size:.92rem;line-height:1.2;font-weight:700;color:#d6284a;font-family:'Segoe UI',Tahoma,sans-serif}
  .polaroid::before{content:"❤️";position:absolute;top:-12px;right:-8px;font-size:1.4rem}
  .btn{
    background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;border:none;
    padding:15px 34px;border-radius:32px;font-size:1.1rem;font-weight:700;cursor:pointer;
    box-shadow:0 6px 22px rgba(255,71,87,.5);transition:.3s;
  }
  .btn:hover{transform:translateY(-3px) scale(1.04)}
  #toLetter{display:none;margin:28px auto 30px;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}

  /* ---------- ETAPA 3: CARTA ---------- */
  .card{
    background:rgba(255,255,255,.96);border-radius:26px;padding:30px 22px;
    box-shadow:0 20px 45px rgba(0,0,0,.22);backdrop-filter:blur(5px);margin:10px 0 30px;
  }
  .card h1{color:#ff4757;font-size:1.8rem;margin-bottom:16px}
  .letter-body{
    color:#2f3542;line-height:1.75;text-align:left;white-space:pre-line;
    background:#fff0f3;padding:20px;border-radius:15px;border-left:5px solid #ff4757;margin-bottom:24px;
    min-height:120px;
  }
  .caret::after{content:"|";animation:blink .7s infinite;color:#ff4757}
  @keyframes blink{50%{opacity:0}}
  .candle-section{background:#ffeaa7;padding:15px;border-radius:15px;margin-bottom:20px;cursor:pointer}
  .candle{font-size:2.6rem;display:inline-block;animation:flame 1s infinite alternate}
  @keyframes flame{0%{transform:scale(1)}100%{transform:scale(1.15) rotate(2deg)}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="container">

  <!-- ETAPA 1 -->
  <section class="stage active" id="stage1">
    <p class="title-hint">💌 Tienes una sorpresa, mi amor</p>
    <p class="sub-hint">Toca el sobre 5 veces para abrirlo 👆</p>

    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="seal">💖</div>
      <div class="to">Para: MI AMOR ❤️</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label" id="plabel">Abriendo tu sorpresa...</div>
      <div class="bar"><div class="bar-fill" id="fill"></div></div>
      <div class="pct" id="pct">0%</div>
    </div>
  </section>

  <!-- ETAPA 2 -->
  <section class="stage" id="stage2">
    <h2>Feliz Cumpleaños, Amor 🎂</h2>
    <p class="sub">Cada foto guarda un pedacito de mi corazón</p>
    <div class="photos" id="photos"></div>
    <button class="btn" id="toLetter">Leer mi carta 💌</button>
  </section>

  <!-- ETAPA 3 -->
  <section class="stage" id="stage3">
    <div class="card">
      <h1>¡Feliz Cumpleaños, Mi Amor! ❤️🎂</h1>
      <div class="letter-body caret" id="letter"></div>
      <div class="candle-section" id="candleBox">
        <div class="candle" id="flame">🕯️</div>
        <p id="candleText" style="font-weight:bold;color:#d35400">¡Toca la vela para pedir un deseo! 🎂</p>
      </div>
      <button class="btn" id="celebrate">🎂 ¡Celebrar a lo Grande!</button>
    </div>
  </section>

</div>

const CARTA = `Hoy es un día muy especial porque celebramos la vida de una persona maravillosa: tú. Quiero que sepas lo feliz que me hace tenerte en mi vida y lo agradecido que estoy con Dios por haberte puesto en mi camino.

Deseo de todo corazón que este nuevo año de vida esté lleno de bendiciones, alegrías, éxitos y muchos sueños cumplidos. Que nunca te falten motivos para sonreír, fuerzas para seguir adelante y personas que te recuerden lo valiosa y especial que eres.

Gracias por cada momento compartido, por tus sonrisas, tus abrazos, tu cariño y por hacer que mis días sean más bonitos con tu presencia. Quiero seguir estando a tu lado, acompañándote en tus triunfos, apoyándote en los días difíciles y creando muchos recuerdos juntos.

No sé qué nos depare el futuro, pero sí sé que deseo seguir compartiendo contigo muchos cumpleaños más, celebrando tu vida y recordándote lo mucho que te amo.

Feliz cumpleaños, mi vida. ❤️ Que la vida te regale todo lo bonito que mereces. Nunca olvides que tienes a alguien que te ama muchísimo y que desea verte feliz siempre.

¡Te amo con todo mi corazón! 💗`;
/* ================================================================ */

// Corazones de fondo
['❤️','💖','💕','✨','🌸','💗','🎂'].forEach((e,i)=>{
  const d=document.createElement('div');
  d.className='floaty';d.textContent=e;
  d.style.left=(8+i*13)+'%';
  d.style.fontSize=(16+Math.random()*16)+'px';
  d.style.animationDuration=(6+Math.random()*4)+'s';
  d.style.animationDelay=(i*1.1)+'s';
  document.body.appendChild(d);
});

const $=id=>document.getElementById(id);
function go(n){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  $('stage'+n).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ---- Etapa 1: clips ----
let removed=0;
const msgs=["¡Uno menos! 😍","¡Vas bien, sigue! 💕","¡Ya casi! 😳","¡Falta solo uno! 🥰","¡Listo! 💌"];
const env=$('envelope');
env.style.cursor='pointer';
[env].forEach(c=>{
  c.addEventListener('click',()=>{
    if(removed>=5)return;
    env.classList.remove('tap');void env.offsetWidth;env.classList.add('tap');
    removed++;
    const p=removed*20;
    $('fill').style.width=p+'%';
    animateNumber(p);
    $('plabel').textContent=msgs[removed-1];
    if(removed===5){
      setTimeout(()=>{
        $('envelope').classList.add('open');
        burst();
        setTimeout(()=>{go(2);showPhotos();},1800);
      },900);
    }
  });
});
let shown=0;
function animateNumber(target){
  const t=setInterval(()=>{
    shown++;$('pct').textContent=shown+'%';
    if(shown>=target)clearInterval(t);
  },18);
}

// ---- Etapa 2: fotos ----
function showPhotos(){
  const box=$('photos');box.innerHTML='';
  FOTOS.forEach((f,i)=>{
    const d=document.createElement('div');
    d.className='polaroid';
    d.style.setProperty('--r',((i%2?1:-1)*(2+Math.random()*3))+'deg');
    const img=new Image();img.src=f.src;img.alt='Foto '+(i+1);img.style.objectPosition=f.pos||'50% 30%';
    d.appendChild(img);
    const s=document.createElement('span');s.textContent=f.texto;d.appendChild(s);
    box.appendChild(d);
    setTimeout(()=>d.classList.add('show'),400+i*700);
  });
  setTimeout(()=>{$('toLetter').style.display='block'},400+FOTOS.length*700+600);
}
$('toLetter').onclick=()=>{go(3);typeLetter();};

// ---- Etapa 3: carta con efecto máquina de escribir ----
let typed=false;
function typeLetter(){
  if(typed)return;typed=true;
  const el=$('letter');let i=0;
  const t=setInterval(()=>{
    el.textContent=CARTA.slice(0,++i);
    if(i>=CARTA.length){clearInterval(t);el.classList.remove('caret')}
  },28);
}
$('letter').addEventListener('click',()=>{ // tocar para mostrar todo
  $('letter').textContent=CARTA;$('letter').classList.remove('caret');
});

$('candleBox').onclick=()=>{
  $('flame').textContent='💨';
  $('candleText').textContent='✨ ¡Deseo concedido! ¡Te amo! ❤️';
  burst();
};
$('celebrate').onclick=()=>{burst();setTimeout(burst,600);setTimeout(burst,1200)};

// ---- Confeti ----
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}
size();addEventListener('resize',size);
function burst(){
  const cols=['#ff4757','#ff9ff3','#feca57','#48dbfb','#1dd1a1','#fff'];
  for(let i=0;i<140;i++)parts.push({
    x:innerWidth/2,y:innerHeight/2,
    vx:(Math.random()-.5)*16,vy:(Math.random()-.9)*16,
    s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,life:140
  });
  if(parts.length===140)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.r+=.2;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    cx.globalAlpha=Math.max(p.life/140,0);cx.fillStyle=p.c;
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();
  });
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);
  if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);
}
